events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Blazor-публикация кладёт рядом с каждым файлом .gz — отдаём готовые, не сжимая на лету.
    gzip_static   on;
    gzip          on;
    gzip_types    text/plain text/css application/json application/javascript
                  application/wasm application/octet-stream;

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        # Лендинг в корне, приложения — в подкаталогах. Каждое приложение это SPA: любой путь
        # внутри него, кроме существующего файла, отдаём его же index.html, иначе прямая ссылка
        # вида /flare/orders вернёт 404 вместо приложения.
        location / {
            try_files $uri $uri/ /index.html;
        }

        location /flare/ {
            try_files $uri $uri/ /flare/index.html;
        }

        location /mudblazor/ {
            try_files $uri $uri/ /mudblazor/index.html;
        }

        location /radzen/ {
            try_files $uri $uri/ /radzen/index.html;
        }

        # Управляющие файлы PWA НЕ кэшируем (ни браузером, ни прокси): иначе после обновления
        # сайта проверка версии читает устаревший service-worker-assets.js и новая версия
        # не доезжает. Правило идёт первым, чтобы выигрывать у правил кэширования ниже.
        location ~* (service-worker(-assets)?\.js|blazor\.boot\.json|\.webmanifest)$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        # Статику с отпечатком в имени можно кэшировать надолго.
        location ~* \.(wasm|dll|dat|blat|pdb)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location ~* \.(js|css|png|svg|ico|json|woff2?)$ {
            add_header Cache-Control "public, max-age=86400";
        }
    }
}

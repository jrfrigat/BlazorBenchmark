# Публикация бенчмарка на GitHub Pages: лендинг в корне сайта и три приложения
# в подкаталогах /flare/, /mudblazor/, /radzen/ — та же раскладка, что в Docker-образе.
# Сервер не нужен: данные отдаёт Shop.Shared внутри браузера.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Публикуем по одной сборке за раз, незавершённые — отменяем.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: |
          dotnet publish src/Shop.Flare/Shop.Flare.csproj         -c Release -o publish/flare
          dotnet publish src/Shop.MudBlazor/Shop.MudBlazor.csproj -c Release -o publish/mudblazor
          dotnet publish src/Shop.Radzen/Shop.Radzen.csproj       -c Release -o publish/radzen

      - name: Собрать сайт
        # Приложение на Pages живёт по адресу /<репозиторий>/<приложение>/ — базовый путь надо
        # прописать и в index.html, и в service-worker.js, иначе после первой же перезагрузки
        # сервис-воркер отдаст ресурсы от чужого пути. Прямые ссылки внутрь приложений
        # разбирает landing/404.html: Pages отдаёт на неизвестный путь только корневой 404.html.
        run: |
          chmod +x scripts/set-base-href.sh
          repo='${{ github.event.repository.name }}'
          mkdir -p site
          cp -r landing/. site/
          for app in flare mudblazor radzen; do
            cp -r "publish/$app/wwwroot" "site/$app"
            scripts/set-base-href.sh "site/$app" "/$repo/$app/"
          done
          # Без .nojekyll Pages выбрасывает каталоги, начинающиеся с подчёркивания
          # (_framework, _content) — приложение просто не загрузится.
          sed -i "s|<base href=\"[^\"]*\"|<base href=\"/$repo/\"|" site/404.html
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

# Весь бенчмарк — один статический сайт: лендинг в корне и три приложения в подкаталогах,
# та же раскладка, что на GitHub Pages. Отдельный сервер API больше не нужен — данные
# отдаёт Shop.Shared прямо в браузере.
#
#   docker compose up -d --build   →   http://localhost:8080
name: blazorbenchmark

services:
  site:
    build:
      context: .
      dockerfile: Dockerfile
    image: blazorbenchmark:latest
    container_name: blazorbenchmark
    restart: unless-stopped
    ports:
      - "8080:80"

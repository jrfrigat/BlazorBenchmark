<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Страница не найдена — Blazor Benchmark</title>
    <!-- Корень сайта: при публикации на GitHub Pages переписывается на /<репозиторий>/ -->
    <base href="/" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🛒</text></svg>" />
    <script>
        // GitHub Pages отдаёт ЭТОТ файл на любой неизвестный путь — и только его: 404.html внутри
        // подкаталога Pages не смотрит. А каждое приложение бенчмарка — SPA в подкаталоге, поэтому
        // прямая ссылка вида /BlazorBenchmark/flare/orders (и ссылки «Диагностика» с лендинга)
        // попадала сюда и показывала лендинг вместо приложения.
        //
        // Переносим маршрут в строку запроса и уходим на index.html нужного приложения:
        //   /BlazorBenchmark/flare/orders  ->  /BlazorBenchmark/flare/?/orders
        // Дальше index.html приложения возвращает адрес на место через history.replaceState,
        // ещё до старта Blazor — маршрутизатор видит уже правильный путь.
        (function () {
            var apps = ['flare', 'mudblazor', 'radzen'];
            var parts = location.pathname.split('/');
            var appIndex = -1;
            for (var i = 0; i < parts.length; i++) {
                if (apps.indexOf(parts[i]) >= 0) { appIndex = i; break; }
            }
            if (appIndex < 0) return; // не путь приложения — показываем страницу ниже

            var base = parts.slice(0, appIndex + 1).join('/') + '/';
            var route = parts.slice(appIndex + 1).join('/');
            // Исходный запрос прячем в тот же параметр: '&' нельзя оставлять как есть, иначе он
            // станет отдельным параметром и потеряется при восстановлении.
            var query = location.search ? '&' + location.search.slice(1).replace(/&/g, '~and~') : '';
            location.replace(base + '?/' + route + query + location.hash);
        })();
    </script>
    <style>
        :root { --bg: #f5f6fa; --surface: #fff; --text: #1a1c24; --muted: #5b6076; --primary: #3f51b5; }

        @media (prefers-color-scheme: dark) {
            :root { --bg: #14161d; --surface: #1c1f29; --text: #eceef5; --muted: #a3a9bd; --primary: #8c9eff; }
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            color: var(--text);
            font-family: Roboto, "Segoe UI", system-ui, sans-serif;
            text-align: center;
        }

        main { padding: 32px; }

        h1 { margin: 0 0 8px; font-size: 2rem; font-weight: 700; }

        p { margin: 0 0 24px; color: var(--muted); }

        a { display: inline-block; padding: 9px 18px; border-radius: 999px; background: var(--primary); color: #fff; text-decoration: none; font-weight: 500; }
    </style>
</head>

<body>
    <main>
        <h1>Страница не найдена</h1>
        <p>Такой страницы на сайте бенчмарка нет.</p>
        <a href="">На главную</a>
    </main>
</body>

</html>

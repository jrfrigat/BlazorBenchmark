<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Магазин — Radzen / Material</title>
    <base href="/" />
    <script>
        // Возвращаем адрес, который 404.html спрятал в строку запроса (?/orders), обратно в путь —
        // до старта Blazor, чтобы маршрутизатор увидел уже нормальный /orders. На GitHub Pages это
        // единственный способ открыть прямую ссылку внутрь приложения: Pages отдаёт на неизвестный
        // путь только корневой 404.html. Локально и в Docker строки запроса нет, и код ничего не делает.
        (function () {
            if (location.search.charAt(1) !== '/') return;
            var route = location.search.slice(2).split('&');
            var path = route[0];
            var query = route.length > 1 ? '?' + route.slice(1).join('&').replace(/~and~/g, '&') : '';
            history.replaceState(null, '', location.pathname + path + query + location.hash);
        })();
    </script>
    <link rel="preload" id="webassembly" />

    <!-- PWA -->
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <meta name="theme-color" content="#3F51B5" />

    <!-- Шрифт Material Design 2 (одинаковый во всех трёх приложениях бенчмарка). Адрес совпадает
         с StyleAssets темы Flare Material Design 2 байт в байт: провайдер Flare узнаёт ссылку
         по адресу, и любое расхождение стоило бы ему второго, позднего запроса шрифта. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" />

    <!-- Radzen: Material-тема (base + swatch) -->
    <link rel="stylesheet" href="_content/Radzen.Blazor/css/material-base.css" />
    <link rel="stylesheet" href="_content/Radzen.Blazor/css/material.css" />
    <script src="_content/Radzen.Blazor/Radzen.Blazor.min#[.{fingerprint}].js"></script>

    <!-- Загрузчик приложения (идентичен во всех трёх приложениях) -->
    <link rel="stylesheet" href="_content/Shop.Shared/css/app.css" />

    <!-- Диагностика нагрузки (общий скрипт из Shop.Shared) -->
    <script src="_content/Shop.Shared/diagnostics.js"></script>
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>

</html>

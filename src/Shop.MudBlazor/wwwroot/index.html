<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Магазин — MudBlazor / Material</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />

    <!-- PWA -->
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <meta name="theme-color" content="#3F51B5" />

    <!-- Шрифт Material Design 2 (одинаковый во всех трёх приложениях бенчмарка) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" />

    <!-- MudBlazor -->
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <script src="_content/MudBlazor/MudBlazor.min#[.{fingerprint}].js"></script>

    <!-- Загрузчик приложения (идентичен во всех трёх приложениях) -->
    <link rel="stylesheet" href="_content/Shop.Shared/css/app.css" />

    <!-- Диагностика нагрузки (общий скрипт из Shop.Shared) -->
    <script src="_content/Shop.Shared/diagnostics.js"></script>
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>

</html>
